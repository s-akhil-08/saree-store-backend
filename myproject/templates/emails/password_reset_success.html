<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful</title>
</head>
<body style="margin:0; padding:0; background-color:#f8f5f0; font-family:Georgia, 'Times New Roman', serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f5f0; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          
          <tr>
            <td style="background-color:#1a1a1a; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#f8f5f0; font-size:22px; font-weight:normal; letter-spacing:3px; text-transform:uppercase;">
                Silk & Loom
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:48px 40px; text-align:center;">
              <div style="width:64px; height:64px; background-color:#e8f5e9; border-radius:50%; margin:0 auto 24px; line-height:64px; font-size:28px;">
                ✓
              </div>
              <h2 style="margin:0 0 16px; color:#1a1a1a; font-size:24px; font-weight:normal;">
                Password Successfully Reset
              </h2>
              <p style="margin:0 0 24px; color:#555; font-size:16px; line-height:1.6;">
                Hello {{user_name}},
              </p>
              <p style="margin:0 0 32px; color:#555; font-size:16px; line-height:1.6;">
                Your password has been successfully updated. You can now log in with your new password.
              </p>

              <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td style="background-color:#1a1a1a; border-radius:6px;">
                    <a href="{{login_url}}" style="display:inline-block; padding:14px 32px; color:#f8f5f0; text-decoration:none; font-size:14px; letter-spacing:1px; text-transform:uppercase;">
                      Login to Your Account
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:32px 0 0; color:#888; font-size:13px;">
                If you did not make this change, please contact our support team immediately.
              </p>
            </td>
          </tr>

          <tr>
            <td style="background-color:#f1ece4; padding:24px 40px; text-align:center;">
              <p style="margin:0; color:#888; font-size:12px;">
                © Silk & Loom
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Silk & Loom</title>
</head>
<body style="margin:0; padding:0; background-color:#f8f5f0; font-family:Georgia, 'Times New Roman', serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f5f0; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          
          <!-- Header -->
          <tr>
            <td style="background-color:#1a1a1a; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#f8f5f0; font-size:22px; font-weight:normal; letter-spacing:3px; text-transform:uppercase;">
                Silk & Loom
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 40px;">
              <h2 style="margin:0 0 16px; color:#1a1a1a; font-size:26px; font-weight:normal;">
                Welcome, {{user_name}}
              </h2>
              <p style="margin:0 0 24px; color:#555; font-size:16px; line-height:1.6;">
                Your account has been successfully created. We’re delighted to have you with us.
              </p>
              <p style="margin:0 0 32px; color:#555; font-size:16px; line-height:1.6;">
                Explore our curated collection of pure silk, semi-silk and handloom sarees — each piece crafted with heritage and care.
              </p>

              <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td style="background-color:#1a1a1a; border-radius:6px;">
                    <a href="{{shop_url}}" style="display:inline-block; padding:14px 32px; color:#f8f5f0; text-decoration:none; font-size:14px; letter-spacing:1px; text-transform:uppercase;">
                      Start Exploring
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f1ece4; padding:24px 40px; text-align:center;">
              <p style="margin:0; color:#888; font-size:12px;">
                © Silk & Loom.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

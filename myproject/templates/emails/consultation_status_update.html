<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation Status Update</title>
</head>

<body style="margin:0; padding:0; background-color:#f8f5f0; font-family:Georgia, 'Times New Roman', serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f5f0; padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Main Email Container -->
        <table width="600" cellpadding="0" cellspacing="0"
          style="
            background-color:#ffffff;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 20px rgba(0,0,0,0.06);
          ">

          <!-- ================= HEADER ================= -->
          <tr>
            <td style="
              background-color:#1a1a1a;
              padding:32px 40px;
              text-align:center;
            ">
              <h1 style="
                margin:0;
                color:#f8f5f0;
                font-size:22px;
                font-weight:normal;
                letter-spacing:3px;
                text-transform:uppercase;
              ">
                Silk & Loom
              </h1>
            </td>
          </tr>


          <!-- ================= MAIN CONTENT ================= -->
          <tr>
            <td style="
              padding:48px 40px;
              text-align:center;
            ">

              <!-- Calendar Icon -->
              <div style="
                width:64px;
                height:64px;
                background-color:#f1ece4;
                border-radius:50%;
                margin:0 auto 24px;
                line-height:64px;
                font-size:28px;
              ">
                📅
              </div>


              <!-- Heading -->
              <h2 style="
                margin:0 0 16px;
                color:#1a1a1a;
                font-size:24px;
                font-weight:normal;
              ">
                Consultation Status Updated
              </h2>


              <!-- Greeting -->
              <p style="
                margin:0 0 24px;
                color:#555;
                font-size:16px;
                line-height:1.6;
              ">
                Dear {{user_name}},
              </p>


              <!-- ================= STATUS MESSAGE ================= -->
              <!-- Small verification-code style box -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 32px;">
                <tr>
                  <td align="center">

                    <div style="
                      display:inline-block;
                      padding:11px 22px;
                      border:1px dashed #3b6ff5;
                      border-radius:7px;
                      background-color:#f8faff;
                      color:#2860df;
                      font-size:16px;
                      font-weight:600;
                      line-height:1.5;
                    ">
                      {{status_message}}
                    </div>

                  </td>
                </tr>
              </table>


              <!-- ================= DETAILS CARD ================= -->
              <table width="100%" cellpadding="0" cellspacing="0"
                style="
                  border:1px solid #e8e0d5;
                  border-radius:8px;
                  overflow:hidden;
                  text-align:left;
                  margin-bottom:32px;
                ">

                <!-- Current Status -->
                <tr>
                  <td style="
                    padding:14px 16px;
                    background-color:#f8f5f0;
                    color:#666;
                    font-size:13px;
                    width:130px;
                    border-bottom:1px solid #e8e0d5;
                  ">
                    Current Status
                  </td>

                  <td style="
                    padding:14px 16px;
                    color:#1a1a1a;
                    font-size:14px;
                    font-weight:bold;
                    border-bottom:1px solid #e8e0d5;
                  ">

                    <span style="
                      display:inline-block;
                      padding:4px 12px;
                      border-radius:12px;
                      color:#ffffff;
                      background-color:{{status_color}};
                      font-size:13px;
                      font-weight:600;
                    ">
                      {{status}}
                    </span>

                  </td>
                </tr>


                <!-- Date -->
                <tr>
                  <td style="
                    padding:12px 16px;
                    background-color:#f8f5f0;
                    color:#666;
                    font-size:13px;
                    border-bottom:1px solid #e8e0d5;
                  ">
                    Date
                  </td>

                  <td style="
                    padding:12px 16px;
                    color:#1a1a1a;
                    font-size:14px;
                    border-bottom:1px solid #e8e0d5;
                  ">
                    {{date}}
                  </td>
                </tr>


                <!-- Time Slot -->
                <tr>
                  <td style="
                    padding:12px 16px;
                    background-color:#f8f5f0;
                    color:#666;
                    font-size:13px;
                    border-bottom:1px solid #e8e0d5;
                  ">
                    Time Slot
                  </td>

                  <td style="
                    padding:12px 16px;
                    color:#1a1a1a;
                    font-size:14px;
                    border-bottom:1px solid #e8e0d5;
                  ">
                    {{time_slot}}
                  </td>
                </tr>


                <!-- Topic -->
                <tr>
                  <td style="
                    padding:12px 16px;
                    background-color:#f8f5f0;
                    color:#666;
                    font-size:13px;
                  ">
                    Topic
                  </td>

                  <td style="
                    padding:12px 16px;
                    color:#1a1a1a;
                    font-size:14px;
                  ">
                    {{topic}}
                  </td>
                </tr>

              </table>


              <!-- Help Text -->
              <p style="
                margin:0;
                color:#888;
                font-size:13px;
                line-height:1.5;
              ">
                If you have any questions or need further assistance,
                please contact us.
              </p>

            </td>
          </tr>


          <!-- ================= FOOTER ================= -->
          <tr>
            <td style="
              background-color:#f1ece4;
              padding:24px 40px;
              text-align:center;
            ">

              <p style="
                margin:0;
                color:#888;
                font-size:12px;
              ">
                © Silk & Loom. All rights reserved.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>

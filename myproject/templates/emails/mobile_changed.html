<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Number Updated</title>
</head>
<body style="margin:0; padding:0; background-color:#f8f5f0; font-family:Georgia, 'Times New Roman', serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f5f0; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          
          <tr>
            <td style="background-color:#1a1a1a; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#f8f5f0; font-size:22px; font-weight:normal; letter-spacing:3px; text-transform:uppercase;">
                Silk & Loom
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:48px 40px;">
              <h2 style="margin:0 0 16px; color:#1a1a1a; font-size:22px; font-weight:normal;">
                Your Mobile Number Was Updated
              </h2>
              <p style="margin:0 0 24px; color:#555; font-size:15px; line-height:1.6;">
                Hello {{user_name}},
              </p>
              <p style="margin:0 0 16px; color:#555; font-size:15px; line-height:1.6;">
                This is a confirmation that the mobile number linked to your account has been changed.
              </p>
              <p style="margin:0 0 8px; color:#555; font-size:15px;">
                <strong>New Mobile:</strong> {{new_mobile}}
              </p>
              <p style="margin:24px 0 0; color:#888; font-size:13px;">
                If you did not authorize this change, please contact our support team right away.
              </p>
            </td>
          </tr>

          <tr>
            <td style="background-color:#f1ece4; padding:24px 40px; text-align:center;">
              <p style="margin:0; color:#888; font-size:12px;">
                © Silk & Loom
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
